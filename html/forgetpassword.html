<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="<?php echo get_template_directory_uri(); ?>/css/login.css" />
    <style>
        /* Chỉ thêm CSS cần thiết cho trang Quên mật khẩu */
        .otp-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .otp-group input {
            flex: 1;
            max-width: 180px;
        }
        .otp-group button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .otp-group button:hover {
            background-color: #0a58ca;
            transform: translateY(-1px);
        }
        .back-to-login {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }
        .back-to-login a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
        }
        .back-to-login a:hover {
            color: #0a58ca;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- image -->
        <div class="image-section">
            <img src="https://tse4.mm.bing.net/th/id/OIP.NLuP6Q7V5dg3eSdpLxUt2QHaE7?pid=Api&P=0&h=220" alt="Forgot password illustration">
        </div>

        <!-- form forgot password -->
        <div class="form-section">
            <div class="form-box">
                <h1 class="title">Quên mật khẩu</h1>
                <p class="welcome-text">Chúng tôi sẽ gửi email cho bạn một liên kết để đặt lại mật khẩu của bạn.</p>

                <form id="forgotPasswordForm">
                    <!-- Email input -->
                    <div class="input-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" placeholder="Nhập email" required>
                    </div>

                    <!-- OTP input + Gửi -->
                    <div class="otp-group">
                        <div class="input-group" style="margin-bottom: 0; flex: 1;">
                            <label for="otp">Mã OTP *</label>
                            <input type="text" id="otp" placeholder="Nhập mã OTP" maxlength="6">
                        </div>
                        <button type="button" id="sendOtpBtn">Gửi</button>
                    </div>

                    <!-- Mật khẩu mới -->
                    <div class="input-group">
                        <label for="newPassword">Mật khẩu mới *</label>
                        <div class="password-wrapper">
                            <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới" required>
                            <button type="button" class="toggle-password" id="toggleNewPassword">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path class="eye-path" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle class="eye-circle" cx="12" cy="12" r="3"></circle>
                                    <line class="eye-slash" x1="1" y1="1" x2="23" y2="23" style="display: none;"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Xác nhận mật khẩu -->
                    <div class="input-group">
                        <label for="confirmPassword">Xác nhận mật khẩu *</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                            <button type="button" class="toggle-password" id="toggleConfirmPassword">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path class="eye-path" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle class="eye-circle" cx="12" cy="12" r="3"></circle>
                                    <line class="eye-slash" x1="1" y1="1" x2="23" y2="23" style="display: none;"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Nút xác nhận -->
                    <button type="submit" class="btn btn-primary">Xác nhận</button>

                    <!-- Quay lại đăng nhập -->
                    <div class="back-to-login">
                        <p>Đã nhớ mật khẩu? <a href="/login">Quay lại đăng nhập</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script toggle password (giống login.js) -->
    <script>
        // Toggle Mật khẩu mới
        document.getElementById('toggleNewPassword').addEventListener('click', function () {
            const input = document.getElementById('newPassword');
            const eyePath = this.querySelector('.eye-path');
            const eyeCircle = this.querySelector('.eye-circle');
            const eyeSlash = this.querySelector('.eye-slash');

            if (input.type === 'password') {
                input.type = 'text';
                eyeSlash.style.display = 'block';
                eyePath.style.opacity = '0.3';
                eyeCircle.style.opacity = '0.3';
            } else {
                input.type = 'password';
                eyeSlash.style.display = 'none';
                eyePath.style.opacity = '1';
                eyeCircle.style.opacity = '1';
            }
        });

        // Toggle Xác nhận mật khẩu
        document.getElementById('toggleConfirmPassword').addEventListener('click', function () {
            const input = document.getElementById('confirmPassword');
            const eyePath = this.querySelector('.eye-path');
            const eyeCircle = this.querySelector('.eye-circle');
            const eyeSlash = this.querySelector('.eye-slash');

            if (input.type === 'password') {
                input.type = 'text';
                eyeSlash.style.display = 'block';
                eyePath.style.opacity = '0.3';
                eyeCircle.style.opacity = '0.3';
            } else {
                input.type = 'password';
                eyeSlash.style.display = 'none';
                eyePath.style.opacity = '1';
                eyeCircle.style.opacity = '1';
            }
        });

        // Gửi OTP (giả lập)
        document.getElementById('sendOtpBtn').addEventListener('click', function () {
            const email = document.getElementById('email').value;
            if (!email) {
                alert('Vui lòng nhập email trước!');
                return;
            }
            this.textContent = 'Đã gửi!';
            this.disabled = true;
            setTimeout(() => {
                this.textContent = 'Gửi lại';
                this.disabled = false;
            }, 3000);
        });
    </script>
</body>
</html>
